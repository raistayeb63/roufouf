<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf2"/><stop offset="1" stop-color="#f0e4d2"/></linearGradient>
 <linearGradient id="brown" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9b6335"/><stop offset=".52" stop-color="#70401f"/><stop offset="1" stop-color="#422516"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#c99a61"/><stop offset="1" stop-color="#8b592e"/></linearGradient>
 <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#56371e" flood-opacity=".15"/></filter>
</defs>
<rect width="1200" height="700" rx="36" fill="url(#bg)"/>
<circle cx="600" cy="260" r="174" fill="#ead9c1" opacity=".42"/>
<g filter="url(#shadow)">
