<text x="600" y="535" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Amiri, 'Traditional Arabic', serif" font-size="100" font-weight="700" fill="url(#brown)">رفوف</text>
