<text x="600" y="613" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Amiri, sans-serif" font-size="25" fill="#8a6848">مكتبتك إلى عوالم لا تنتهي</text>
